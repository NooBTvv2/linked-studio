<!DOCTYPE html>

<head>

            <div style="background-image: url(Images/GameImages/Descent.png);"></div>
            <div style="background-image: url(Images/GameImages/FNH.webp);"></div>

            <div style="background-image: url(Images/GameImages/LA.png);"></div>

            <div style="background-image: url(Images/GameImages/SB.webp);"></div>
            <div style="background-image: url(Images/GameImages/SS.png);"></div>
            <div style="background-image: url(Images/GameImages/WoD.webp);"></div>

    <section id="credentials-container">
        <h1 style="text-align: center; margin-bottom: 45px;">Linked Studios</h1>

        <div class="form-wrapper">

            <form action="">
                <label>
                    <p>Username</p>
                    <input placeholder="" type="text" id="username" required>
                </label>

                <label>
                    <p>Email Address</p>
                    <input placeholder="" type="email" id="email" required>
                </label>

                <label>
                    <p>Password</p>
                    <input placeholder="" type="password" id="password" required>
                </label>

                <label>
                    <p>Confirm Password</p>
                    <input placeholder="" type="password" id="password" required>
                </label>

                <button>Sign up!</button>
                <a href="signin.html">Already have an account?</a>
            </form>
        </div>
    </section>

</html>
